// ============================================================================
// ARMST MP-133 T4b - Phase B0 additive input overlay (STAGED, lab-owned).
//
// Adds a diagnostic action `ARMST_MP133_Reload` bound to physical KC_R and a
// dedicated `ARMST_MP133_ReloadContext`. Additive only: it does NOT touch
// ARMST-PLATFORM---Core or any production input config.
//
// Evidence (Phase A / SOURCE): ARMST-PLATFORM---Core/Configs/System/chimeraInputCommon.conf
// redeclares the VANILLA context `CharacterGeneralContext` with an ADDITIVE array
// `ActionRefs +{ ... }`. `+{` only makes sense if the base context already exists,
// i.e. the engine MERGES an addon's chimeraInputCommon.conf with the base config
// (otherwise Core's file would wipe the vanilla actions and break the game). This
// file follows the same overlay pattern.
//
// Suppression (Priority/Flags) is NOT proven here: the base context priority and the
// meaning of `Flags` are undocumented in SDK 1.8.0.13. `Flags 0x6 0` is copied verbatim
// from an EXISTING verified context (BookContext / TraderContext in Core's file) and
// `Priority 20000` is chosen above the highest observed value (10000, ARMST_Pda3DContext).
// Whether this actually blocks the vanilla reload action is exactly what Phase B measures.
// ============================================================================
ActionManager {
 Actions {
  Action ARMST_MP133_Reload {
   InputSource InputSourceValue "{B1C2D3E4F5A60001}" {
    Input "keyboard:KC_R"
   }
  }
 }
 Contexts {
  ActionContext ARMST_MP133_ReloadContext {
   Priority 20000
   Flags 0x6 0
   ActionRefs +{
    "ARMST_MP133_Reload"
   }
  }
 }
}
