name: Repository integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Run repository integrity checks
        run: python agent/scripts/check_repository_integrity.py

      - name: Verify weapon index is current
        run: |
          if ! python agent/scripts/build_weapon_index.py --check; then
            python agent/scripts/build_weapon_index.py
            echo "Generated WEAPON_INDEX.md diff:"
            git --no-pager diff -- WEAPON_INDEX.md
            exit 1
          fi

      - name: Verify weapon family pages are current
        run: |
          if ! python agent/scripts/build_weapon_family_pages.py --check; then
            python agent/scripts/build_weapon_family_pages.py
            echo "Generated family-page diff:"
            git --no-pager diff -- reports/families/
            exit 1
          fi
