name: Resolver v2 tests

on:
  push:
    branches:
      - agent/resolver-v2
  pull_request:
    paths:
      - 'agent/scripts/et_parser.py'
      - 'agent/scripts/resolver_v2*.py'
      - 'agent/scripts/scan_build_v2*.py'
      - 'agent/scripts/architecture_index.py'
      - 'agent/scripts/script_class_index.py'
      - 'agent/scripts/sync_vanilla_scripts.py'
      - 'agent/scripts/reference_cases_v2.py'
      - 'agent/tests/test_resolver_v2*.py'
      - '.github/workflows/resolver-v2-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile resolver v2 scripts
        run: >-
          python -m py_compile
          agent/scripts/et_parser.py
          agent/scripts/resolver_v2.py
          agent/scripts/resolver_v2_configs.py
          agent/scripts/resolver_v2_strict.py
          agent/scripts/resolver_v2_extract.py
          agent/scripts/scan_build_v2.py
          agent/scripts/scan_build_v2_strict.py
          agent/scripts/architecture_index.py
          agent/scripts/script_class_index.py
          agent/scripts/sync_vanilla_scripts.py
          agent/scripts/scan_v2_probe.py
          agent/scripts/reference_cases_v2.py
      - name: Run resolver tests
        run: python -m unittest discover -s agent/tests -p 'test_resolver_v2*.py' -v
